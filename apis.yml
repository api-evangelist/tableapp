name: TableApp
description: TABLEAPP (Tableapp Sdn Bhd, part of FunNow Ltd) is a real-time restaurant discovery and
  reservation platform serving diners across Malaysia (Klang Valley) and Thailand. Consumers discover
  restaurants and book tables with instant confirmation through the TABLEAPP website and iOS/Android
  apps, and the TABLEAPP ELITE membership unlocks free signature dishes at partner restaurants, alongside
  dining vouchers and gift cards. Restaurateurs list on both TABLEAPP and FunNow and manage reservations
  and guest preferences with the TABLEAPP Manager tools. TableApp is a 500 Global portfolio company; it
  operates a private mobile-app backend (api.tableapp.com) but publishes no public developer API, OpenAPI
  specification, SDKs, or developer portal at this time.
